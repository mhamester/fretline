<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fretline — Tab Practice</title>
<style>
  :root {
    --bg: #15130F;
    --bg-raised: #1D1A14;
    --line: #332D22;
    --ink: #EDE7D8;
    --ink-dim: #A99F8A;
    --brass: #C9A15C;
    --brass-dim: #8A713F;
    --hit: #5FA777;
    --miss: #B4593E;
    --pending: #4A4437;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  .tab-mono {
    font-family: "SF Mono", "Menlo", "Cascadia Code", ui-monospace, monospace;
  }

  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 22px 4px 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }

  header .brand {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  header .brand span { color: var(--brass); }

  header .tagline {
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  nav.tabs {
    display: flex;
    gap: 4px;
    margin: 16px 0;
    background: var(--bg-raised);
    border-radius: 10px;
    padding: 4px;
  }
  nav.tabs button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font-size: 13px;
    font-weight: 600;
    padding: 9px 6px;
    border-radius: 7px;
    cursor: pointer;
  }
  nav.tabs button.active {
    background: var(--brass);
    color: #15130F;
  }

  section { display: none; flex: 1; min-height: 0; overflow-y: auto; }
  section.active { display: flex; flex-direction: column; }

  /* ---- Library ---- */
  .song-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .song-card {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .song-card:active { border-color: var(--brass-dim); }
  .song-card .meta { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
  .song-card .go { color: var(--brass); font-size: 20px; }

  .import-box {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .import-box h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-dim); margin: 0 0 10px; }
  .import-box textarea {
    width: 100%;
    min-height: 140px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    padding: 12px;
    font-size: 13px;
    resize: vertical;
  }
  .field-row { display: flex; gap: 8px; margin-top: 10px; }
  .field-row input[type=text] {
    flex: 1;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    padding: 10px 12px;
    font-size: 14px;
  }
  .btn {
    background: var(--brass);
    color: #15130F;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--brass-dim);
    color: var(--brass);
  }
  .btn:active { opacity: 0.8; }
  .error-msg { color: var(--miss); font-size: 12px; margin-top: 8px; min-height: 14px; }

  /* ---- Practice ---- */
  .practice-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .practice-head h2 { font-size: 16px; margin: 0; }
  .practice-head .sub { font-size: 12px; color: var(--ink-dim); }

  .tuner {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 16px;
    text-align: center;
    margin-bottom: 10px;
  }
  .tuner .target {
    font-size: 12px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .tuner .target b { color: var(--brass); font-size: 15px; letter-spacing: 0; text-transform: none; }
  .meter {
    position: relative;
    height: 10px;
    background: var(--line);
    border-radius: 6px;
    margin: 12px 0 8px;
    overflow: hidden;
  }
  .meter .needle {
    position: absolute;
    top: 0; bottom: 0;
    width: 4px;
    background: var(--ink-dim);
    left: 50%;
    transform: translateX(-50%);
    transition: left 60ms linear, background 150ms;
    border-radius: 2px;
  }
  .meter .center-mark {
    position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px;
    background: var(--brass-dim); transform: translateX(-50%);
  }
  .heard { font-size: 13px; color: var(--ink-dim); min-height: 18px; }
  .heard b { color: var(--ink); }

  .tabline-wrap {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 8px 4px;
    overflow-x: auto;
    overflow-y: auto;
    max-height: 80px;
    flex-shrink: 0;
  }
  .tabline {
    display: inline-flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px 12px;
  }
  .tabrow {
    display: flex;
    align-items: center;
    white-space: pre;
    font-size: 17px;
    line-height: 1.9;
  }
  .tabrow .stringname {
    width: 18px;
    color: var(--ink-dim);
    flex-shrink: 0;
  }
  .fretcell {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    color: var(--ink-dim);
  }
  .fretcell.note {
    color: var(--ink);
    font-weight: 700;
    border-radius: 4px;
  }
  .fretcell.pending { color: var(--ink); }
  .fretcell.current {
    background: var(--brass);
    color: #15130F !important;
    box-shadow: 0 0 0 2px var(--brass);
  }
  .fretcell.hit { background: var(--hit); color: #0e1a12 !important; }
  .fretcell.miss { background: var(--miss); color: #1a0e0a !important; }

  .controls {
    display: flex; gap: 10px; margin-top: 14px; align-items: center;
  }
  .controls .btn { flex: 1; }
  .mic-status { font-size: 11px; color: var(--ink-dim); text-align: center; margin-top: 8px; }
  .mic-status.live { color: var(--hit); }
  .mic-status.err { color: var(--miss); }

  /* ---- Tempo / metronome controls ---- */
  .tempo-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .tempo-field {
    display: flex; align-items: center; gap: 4px;
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 5px 6px;
  }
  .tempo-field label {
    font-size: 10px; color: var(--ink-dim); text-transform: uppercase;
    letter-spacing: 0.05em; padding: 0 2px;
  }
  .tempo-field input[type=number] {
    width: 44px; background: transparent; border: none; color: var(--ink);
    font-size: 15px; font-weight: 700; text-align: center;
    -moz-appearance: textfield;
  }
  .tempo-field input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .stepper-btn {
    background: var(--line); color: var(--ink); border: none;
    width: 24px; height: 24px; border-radius: 6px; font-size: 15px;
    line-height: 1; cursor: pointer; flex-shrink: 0;
  }
  .stepper-btn:active { opacity: 0.7; }
  .grid-select {
    background: var(--bg-raised); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 10px; padding: 8px 8px; font-size: 11px; flex: 1;
  }
  .metro-toggle {
    background: var(--bg-raised); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 10px; padding: 8px 11px; font-size: 15px; cursor: pointer; flex-shrink: 0;
  }
  .metro-toggle.on { color: var(--brass); border-color: var(--brass-dim); }

  /* ---- Waterfall ---- */
  .waterfall-wrap {
    position: relative;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 10px;
    flex: 1;
    min-height: 140px;
    overflow: hidden;
  }
  .wf-scrollarea {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }
  .wf-hitline {
    position: absolute; top: 0; bottom: 0; left: 62px; width: 2px;
    background: var(--brass); z-index: 3;
  }
  .wf-hitline::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: -18px; width: 36px;
    background: linear-gradient(90deg, transparent, rgba(201,161,92,0.12), transparent);
  }
  .wf-labels {
    position: absolute; top: 0; left: 0; bottom: 0; width: 26px;
    display: flex; flex-direction: column; z-index: 4;
    background: linear-gradient(90deg, var(--bg-raised) 55%, transparent);
  }
  .wf-labels div {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--ink-dim);
  }
  .wf-notes-layer {
    position: absolute; top: 0; left: 26px; height: 100%; will-change: transform;
  }
  .wf-lane-row {
    position: absolute; left: 0; height: 34px;
  }
  .wf-lane-row:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.04); }
  .wf-chip {
    position: absolute; top: 3px; width: 27px; height: 27px; border-radius: 8px;
    background: var(--pending); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; border: 1px solid var(--line);
  }
  .wf-chip.active {
    background: var(--brass); color: #15130F; box-shadow: 0 0 0 2px var(--brass);
  }
  .wf-chip.hit { background: var(--hit); color: #0e1a12; border-color: var(--hit); }
  .wf-chip.miss { background: var(--miss); color: #1a0e0a; border-color: var(--miss); }

  .countin-overlay {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; justify-content: center;
    background: rgba(21,19,15,0.88); border: 1px solid var(--brass-dim);
    border-radius: 20px; padding: 5px 14px; z-index: 5;
    font-size: 13px; font-weight: 700; color: var(--brass); white-space: nowrap;
  }

  .score-pill {
    font-size: 12px; color: var(--ink-dim); background: var(--bg-raised);
    border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px;
  }
  .score-pill b { color: var(--brass); }

  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--ink-dim); gap: 10px; padding: 40px 20px;
  }
  .empty-state .glyph { font-size: 34px; color: var(--brass-dim); }

  footer {
    text-align: center; font-size: 11px; color: var(--ink-dim); padding-top: 18px; opacity: 0.7;
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <div class="brand">Fret<span>line</span></div>
      <div class="tagline">Play it. Hear it check itself.</div>
    </div>
    <div class="score-pill" id="globalScore" style="display:none;">Accuracy <b id="globalScoreVal">—</b></div>
  </header>

  <nav class="tabs">
    <button class="active" data-view="library">Library</button>
    <button data-view="practice">Practice</button>
  </nav>

  <section id="view-library" class="active">
    <div class="song-list" id="songList"></div>

    <div class="import-box">
      <h3>Import your own tab</h3>
      <div class="field-row">
        <input type="text" id="importTitle" placeholder="Song title (optional)">
      </div>
      <textarea id="importText" placeholder="Paste a standard 6-line ASCII tab here, e.g.&#10;e|--0---0---3-|&#10;B|----1---3---|&#10;G|--------0---|&#10;D|------------|&#10;A|------------|&#10;E|------------|"></textarea>
      <div class="error-msg" id="importError"></div>
      <div class="field-row">
        <button class="btn" id="importBtn">Load into Practice</button>
      </div>
    </div>
  </section>

  <section id="view-practice">
    <div id="practiceEmpty" class="empty-state">
      <div class="glyph">♪</div>
      <div>No tab loaded yet.</div>
      <div>Pick a song from the Library, or paste your own.</div>
      <button class="btn secondary" onclick="switchView('library')">Go to Library</button>
    </div>

    <div id="practiceMain" style="display:none; flex:1; min-height:0; display:flex; flex-direction:column;">
      <div class="practice-head">
        <div>
          <h2 id="practiceTitle">—</h2>
          <div class="sub" id="practiceSub">Tap Start, then play along</div>
        </div>
      </div>

      <div class="tempo-row">
        <div class="tempo-field">
          <button class="stepper-btn" id="bpmDown">−</button>
          <label>BPM</label>
          <input type="number" id="bpmInput" value="80" min="30" max="220">
          <button class="stepper-btn" id="bpmUp">+</button>
        </div>
        <select class="grid-select" id="gridSelect">
          <option value="4" selected>1 char = 16th note</option>
          <option value="2">1 char = 8th note</option>
        </select>
        <button class="metro-toggle on" id="metroToggle" title="Toggle metronome sound">🔊</button>
        <button class="metro-toggle" id="waitToggle" title="Wait for the correct note instead of moving on">⏸</button>
      </div>

      <div class="tuner">
        <div class="target">Listening for <b id="targetNote">—</b></div>
        <div class="meter"><div class="center-mark"></div><div class="needle" id="needle"></div></div>
        <div class="heard" id="heardNote">Mic idle</div>
      </div>

      <div class="waterfall-wrap">
        <div class="wf-scrollarea" id="wfScrollarea">
          <div class="wf-hitline"></div>
          <div class="wf-labels" id="wfLabels"></div>
          <div class="wf-notes-layer" id="wfNotesLayer"></div>
        </div>
        <div class="countin-overlay" id="countInOverlay">4</div>
      </div>

      <div class="tabline-wrap">
        <div class="tabline" id="tabRender"></div>
      </div>

      <div class="controls">
        <button class="btn" id="startBtn">Start Practice</button>
        <button class="btn secondary" id="resetBtn">Reset</button>
      </div>
      <div class="controls" style="margin-top:8px;">
        <button class="btn secondary" id="previewBtn">▶ Preview Tab Sound</button>
      </div>
      <div class="mic-status" id="micStatus"></div>
    </div>
  </section>

  <footer>Free, runs entirely in your browser. Audio never leaves your device.</footer>
</div>

<script>
/* ============================================================
   1. TAB PARSING
   Standard notation: 6 lines top-to-bottom = e B G D A E
   Each line: "e|--3--0--|" — digits are frets, '-' is rest,
   position in the string (character index) = time slot.
   ============================================================ */

const STRING_ORDER = ['e','B','G','D','A','E']; // high to low, standard display order
const OPEN_MIDI = { e: 64, B: 59, G: 55, D: 50, A: 45, E: 40 }; // standard tuning MIDI numbers

function parseTab(raw) {
  const lines = raw.split('\n').map(l => l.replace(/\r/g,'')).filter(l => l.trim().length > 0);
  // Find 6 lines that look like tab lines: start with a string-name char then '|'
  const tabLines = [];
  for (const line of lines) {
    const m = line.match(/^\s*([eEbBgGdDaA])\|?[-0-9hpb\/\\~x|]+\|?\s*$/);
    if (m) tabLines.push(line);
  }
  if (tabLines.length < 6) {
    throw new Error("Couldn't find 6 tab lines (one per string). Use standard format like: e|--3--0--|");
  }
  // take first 6 consecutive matching lines as one block (supports only first block for v1)
  const block = tabLines.slice(0, 6);

  // identify string name per line (first non-space char)
  const parsed = block.map(line => {
    const nameChar = line.trim()[0].toLowerCase();
    const body = line.replace(/^\s*[eEbBgGdDaA]/, '').replace(/\|/g, '|');
    return { nameChar, body };
  });

  // map to canonical order e B G D A E by matching name chars, allow e/E ambiguity by position
  // If names collide (e and E both lowercase 'e'), fall back to positional order (top->bottom = e,B,G,D,A,E)
  const order = ['e','b','g','d','a','e2'];
  let canon;
  const nameChars = parsed.map(p => p.nameChar);
  const hasDupE = nameChars.filter(c => c === 'e').length === 2;
  if (hasDupE) {
    canon = parsed; // assume already top-to-bottom = e,B,G,D,A,E
  } else {
    canon = parsed;
  }

  const stringKeys = ['e','B','G','D','A','E'];
  const maxLen = Math.max(...canon.map(p => p.body.length));
  const padded = canon.map(p => p.body.padEnd(maxLen, '-'));

  // walk column by column, extract frets (handle multi-digit frets like 10,12)
  const notesByCol = []; // { col, events: [{stringIdx, fret}] }
  let col = 0;
  while (col < maxLen) {
    const events = [];
    for (let s = 0; s < 6; s++) {
      const ch = padded[s][col];
      if (ch && /[0-9]/.test(ch)) {
        // check for second digit
        let numStr = ch;
        let consumed = 1;
        const next = padded[s][col+1];
        if (next && /[0-9]/.test(next)) {
          numStr += next;
          consumed = 2;
        }
        events.push({ stringIdx: s, fret: parseInt(numStr, 10), width: consumed });
      }
    }
    if (events.length > 0) {
      const maxWidth = Math.max(...events.map(e => e.width));
      notesByCol.push({ col, events });
      col += maxWidth;
    } else {
      col += 1;
    }
  }

  if (notesByCol.length === 0) {
    throw new Error("No notes found in the tab — check the format (digits = frets, '-' = rest).");
  }

  // flatten into a linear note sequence (one entry per string hit, grouped by column = chord)
  const sequence = notesByCol.map(group => ({
    col: group.col,
    notes: group.events.map(e => ({
      stringKey: stringKeys[e.stringIdx],
      fret: e.fret,
      midi: OPEN_MIDI[stringKeys[e.stringIdx]] + e.fret
    }))
  }));

  return { stringKeys, sequence, raw };
}

function midiToName(midi) {
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const octave = Math.floor(midi / 12) - 1;
  return names[midi % 12] + octave;
}

function freqToMidi(freq) {
  return 69 + 12 * Math.log2(freq / 440);
}
function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

/* ============================================================
   2. BUILT-IN LIBRARY (simple riffs, free/traditional or original)
   ============================================================ */

const LIBRARY = [
  {
    id: 'warmup-frets',
    title: 'Warm-Up: Open Position Run',
    meta: 'Beginner · single notes',
    tab:
`e|----------------0-1-3-|
B|------------0-1-------|
G|--------0-2------------|
D|----0-2----------------|
A|--------------------- -|
E|------------------------|`
  },
  {
    id: 'ode-to-joy',
    title: 'Ode to Joy (full theme)',
    meta: 'Traditional · Beethoven — full 8-bar melody',
    tab:
`e|0-0-1-3-3-1-0---------0-0-------0-0-1-3-3-1-0---------0--------|
B|--------------3-1-1-3-----3-3-3---------------3-1-1-3---3-1-1-1|
G|---------------------------------------------------------------|
D|---------------------------------------------------------------|
A|---------------------------------------------------------------|
E|---------------------------------------------------------------|`
  },
  {
    id: 'greensleeves',
    title: 'Greensleeves (opening motif)',
    meta: 'Traditional — short excerpt',
    tab:
`e|----------0---3-|
B|--------1---1---|
G|------0---------|
D|--2-------------|
A|----------------|
E|----------------|`
  },
  {
    id: 'waterfall-demo',
    title: 'Waterfall Demo',
    meta: 'Original · all 6 strings, wide fretboard range',
    tab:
`e|--------------------0-3-1------|
B|----------------0-3-------1----|
G|------------0-2-------------0--|
D|--------0-2-------------------2|
A|----0-2------------------------|
E|0-3----------------------------|`
  }
];

/* ============================================================
   3. PITCH DETECTION (autocorrelation)
   ============================================================ */

let audioCtx = null;
let analyser = null;
let micStream = null;
let rafId = null;
let smoothedMidi = null;

function autoCorrelate(buf, sampleRate, expectedFreqs) {
  // YIN pitch detection. Uses a true global-minimum search (more reliable
  // than a "first dip below a fixed threshold" heuristic) and judges
  // candidates RELATIVE to each other rather than against fixed absolute
  // cutoffs — fixed cutoffs were both rejecting valid-but-noisier signals
  // (causing dead zones at some frets) and occasionally accepting a
  // stronger harmonic over a genuine but quieter fundamental.
  const SIZE = buf.length;

  let rms = 0;
  for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < 0.006) return -1; // too quiet / no signal

  const halfSize = Math.floor(SIZE / 2);
  const yinBuffer = new Float32Array(halfSize);

  // Step 1: difference function
  for (let tau = 0; tau < halfSize; tau++) {
    let sum = 0;
    for (let i = 0; i < halfSize; i++) {
      const delta = buf[i] - buf[i + tau];
      sum += delta * delta;
    }
    yinBuffer[tau] = sum;
  }

  // Step 2: cumulative mean normalized difference
  yinBuffer[0] = 1;
  let runningSum = 0;
  for (let tau = 1; tau < halfSize; tau++) {
    runningSum += yinBuffer[tau];
    yinBuffer[tau] = runningSum === 0 ? 1 : (yinBuffer[tau] * tau) / runningSum;
  }

  // Restrict candidate search to guitar's practical range (with margin) so
  // we never lock onto very-high-frequency noise or sub-audio rumble.
  const minFreq = 65;   // below low E (82.4 Hz)
  const maxFreq = 1200;
  const tauMin = Math.max(2, Math.floor(sampleRate / maxFreq));
  const tauMax = Math.min(halfSize - 2, Math.ceil(sampleRate / minFreq));
  if (tauMax <= tauMin) return -1;

  function parabolicRefine(tau) {
    const x0 = tau <= tauMin ? tau : tau - 1;
    const x2 = tau + 1 <= tauMax ? tau + 1 : tau;
    if (x0 === tau) return yinBuffer[tau] <= yinBuffer[x2] ? tau : x2;
    if (x2 === tau) return yinBuffer[tau] <= yinBuffer[x0] ? tau : x0;
    const s0 = yinBuffer[x0], s1 = yinBuffer[tau], s2 = yinBuffer[x2];
    const denom = 2 * (2 * s1 - s2 - s0);
    return denom === 0 ? tau : tau + (s2 - s0) / denom;
  }

  // True global minimum across the whole valid range — the ground truth
  // we compare every other candidate against.
  let globalIdx = -1, globalVal = Infinity;
  for (let tau = tauMin; tau <= tauMax; tau++) {
    if (yinBuffer[tau] < globalVal) { globalVal = yinBuffer[tau]; globalIdx = tau; }
  }
  if (globalIdx === -1 || globalVal > 0.5) return -1; // nothing periodic enough anywhere

  // One-octave-down correction on the global candidate: a strong 2nd
  // harmonic can create a spurious dip at a shorter period than the true
  // fundamental. Only switch down if the longer period is genuinely
  // comparable, not just "under some loose bound."
  function localMin(tau) {
    let best = tau, bestVal = yinBuffer[tau];
    for (let d = -2; d <= 2; d++) {
      const idx = tau + d;
      if (idx >= tauMin && idx <= tauMax && yinBuffer[idx] < bestVal) {
        bestVal = yinBuffer[idx];
        best = idx;
      }
    }
    return { idx: best, val: bestVal };
  }
  let correctedIdx = globalIdx;
  const doubledTau = globalIdx * 2;
  if (doubledTau <= tauMax) {
    const dbl = localMin(doubledTau);
    if (dbl.val <= globalVal * 1.15 && dbl.val < 0.2) {
      correctedIdx = dbl.idx;
    }
  }

  // If we know which note(s) are expected (mid-practice), prefer a match
  // near them as long as it's not drastically worse than the true best
  // match anywhere — judged relative to globalVal, not a fixed cutoff.
  // This sidesteps octave ambiguity without ever forcing a fake reading
  // when the person genuinely played something else.
  if (expectedFreqs && expectedFreqs.length > 0) {
    const CENTS_WINDOW = 150; // a bit more than a semitone either side
    let windowIdx = -1, windowVal = Infinity;
    for (const f of expectedFreqs) {
      const freqHigh = f * Math.pow(2, CENTS_WINDOW / 1200);
      const freqLow = f * Math.pow(2, -CENTS_WINDOW / 1200);
      const lo = Math.max(tauMin, Math.floor(sampleRate / freqHigh));
      const hi = Math.min(tauMax, Math.ceil(sampleRate / freqLow));
      for (let tau = lo; tau <= hi; tau++) {
        if (yinBuffer[tau] < windowVal) { windowVal = yinBuffer[tau]; windowIdx = tau; }
      }
    }
    if (windowIdx !== -1 && windowVal <= globalVal * 1.6 && windowVal < 0.55) {
      const refined = parabolicRefine(windowIdx);
      return refined > 0 ? sampleRate / refined : -1;
    }
    // Genuinely nothing near the expected note — fall through so we still
    // report the actual pitch heard (a real miss, not a masked one).
  }

  const betterTau = parabolicRefine(correctedIdx);
  if (betterTau <= 0) return -1;
  return sampleRate / betterTau;
}

async function startMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: { ideal: false },
        noiseSuppression: { ideal: false },
        autoGainControl: { ideal: true }
      }
    });
  } catch (e) {
    setMicStatus('Microphone access denied or unavailable.', 'err');
    return false;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
  const source = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 4096;
  source.connect(analyser);
  setMicStatus('Mic live — listening', 'live');
  pitchLoop();
  return true;
}

function stopMic() {
  if (rafId) cancelAnimationFrame(rafId);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  micStream = null; audioCtx = null; analyser = null;
  setMicStatus('');
}

function setMicStatus(msg, cls) {
  const el = document.getElementById('micStatus');
  el.textContent = msg;
  el.className = 'mic-status' + (cls ? ' ' + cls : '');
}

function getExpectedFrequencies() {
  if (!practiceRunning || !currentTab) return null;
  if (seqIndex >= currentTab.parsed.sequence.length) return null;
  const group = currentTab.parsed.sequence[seqIndex];
  return group.notes.map(n => midiToFreq(n.midi));
}

function pitchLoop() {
  if (!analyser) return;
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  const expected = getExpectedFrequencies();
  const freq = autoCorrelate(buf, audioCtx.sampleRate, expected);

  if (freq > 60 && freq < 1200) {
    const midi = freqToMidi(freq);
    smoothedMidi = smoothedMidi === null ? midi : smoothedMidi * 0.6 + midi * 0.4;
    onPitchDetected(smoothedMidi);
  } else {
    smoothedMidi = null;
    onPitchDetected(null);
  }

  if (practiceRunning && currentTab) {
    const elapsed = audioCtx.currentTime - practiceStartTime - totalPausedDuration;
    updateWaterfallScroll(elapsed);
    updateCountInOverlay(elapsed);
    updateActiveChip(elapsed);
    judgeTiming(elapsed);
  }

  rafId = requestAnimationFrame(pitchLoop);
}

/* ============================================================
   4. PRACTICE ENGINE
   ============================================================ */

let currentTab = null;
let seqIndex = 0;
let results = []; // 'hit' | 'miss' | null per sequence index
let practiceRunning = false;
let holdFrames = 0;
const HOLD_NEEDED = 3; // consecutive good frames to count as a hit (short — timing windows are brief)
const CENTS_TOLERANCE = 45; // how close in cents counts as correct

// --- Tempo / metronome / waterfall state ---
const COUNT_IN_BEATS = 4;
const PX_PER_SEC = 130;      // waterfall scroll scale
const LANE_HEIGHT = 34;
const LANE_OFFSET = 36;      // px: aligns a chip with the hitline when elapsed === its scheduled time
let bpm = 80;
let subdivision = 4;         // characters per beat (grid resolution assumption)
let metronomeOn = true;
let schedulerTimer = null;
let nextClickTime = 0;
let clickCounter = 0;
let secPerBeat = 60 / bpm;
let secPerChar = secPerBeat / subdivision;
let countInSeconds = COUNT_IN_BEATS * secPerBeat;
let scheduleTimes = [];      // seconds offset per sequence index
let hitWindow = 0.25;
let practiceStartTime = 0;
let waitMode = false;        // when true, pause on a missed window instead of moving on
let isPaused = false;
let pauseStartTime = 0;
let totalPausedDuration = 0;

function computeHitWindow(currentBpm) {
  const spb = 60 / currentBpm;
  return Math.min(0.9, Math.max(0.18, 0.5 * spb));
}

function scheduleClick(time, accent) {
  if (!metronomeOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = accent ? 1500 : 1000;
  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(0.5, time + 0.001);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.05);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.06);
}

function metronomeScheduler() {
  if (!audioCtx || isPaused) return;
  const scheduleAhead = 0.1;
  while (nextClickTime < audioCtx.currentTime + scheduleAhead) {
    scheduleClick(nextClickTime, clickCounter % 4 === 0);
    nextClickTime += secPerBeat;
    clickCounter++;
  }
}

function startTempoEngine() {
  secPerBeat = 60 / bpm;
  secPerChar = secPerBeat / subdivision;
  countInSeconds = COUNT_IN_BEATS * secPerBeat;
  hitWindow = computeHitWindow(bpm);
  scheduleTimes = currentTab.parsed.sequence.map(g => countInSeconds + g.col * secPerChar);
  isPaused = false;
  totalPausedDuration = 0;

  const startDelay = 0.15;
  practiceStartTime = audioCtx.currentTime + startDelay;
  nextClickTime = practiceStartTime;
  clickCounter = 0;

  buildWaterfall();
  if (schedulerTimer) clearInterval(schedulerTimer);
  schedulerTimer = setInterval(metronomeScheduler, 25);
}

function stopTempoEngine() {
  if (schedulerTimer) { clearInterval(schedulerTimer); schedulerTimer = null; }
  document.getElementById('countInOverlay').style.display = 'none';
}

/* ============================================================
   PREVIEW PLAYBACK — hear what the loaded tab sounds like
   ============================================================ */

let previewPlaying = false;
let previewNodes = [];
let previewEndTimer = null;

function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
  }
  return audioCtx;
}

function pluckNote(freq, startTime, duration) {
  const ctx = audioCtx;
  const osc1 = ctx.createOscillator();
  osc1.type = 'triangle';
  osc1.frequency.value = freq;
  const osc2 = ctx.createOscillator(); // slight detune for a fuller, less synthetic tone
  osc2.type = 'triangle';
  osc2.frequency.value = freq * 1.004;

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(Math.min(freq * 7, 8000), startTime);
  filter.frequency.exponentialRampToValueAtTime(Math.max(freq * 1.3, 220), startTime + duration);

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(0.45, startTime + 0.006); // fast pluck attack
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration); // natural decay

  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  osc1.start(startTime); osc1.stop(startTime + duration + 0.05);
  osc2.start(startTime); osc2.stop(startTime + duration + 0.05);
  previewNodes.push(osc1, osc2);
}

function setPreviewButtonState(playing) {
  const btn = document.getElementById('previewBtn');
  btn.textContent = playing ? '■ Stop Preview' : '▶ Preview Tab Sound';
}

function playPreview() {
  if (!currentTab) return;
  if (previewPlaying) { stopPreview(); return; }
  ensureAudioCtx();
  previewPlaying = true;
  setPreviewButtonState(true);

  const spb = 60 / bpm;
  const spc = spb / subdivision;
  const leadIn = 0.25;

  currentTab.parsed.sequence.forEach(group => {
    const t = audioCtx.currentTime + leadIn + group.col * spc;
    group.notes.forEach(n => {
      const freq = midiToFreq(n.midi);
      pluckNote(freq, t, Math.min(spb * 0.95, 0.9));
    });
  });

  const lastCol = currentTab.parsed.sequence[currentTab.parsed.sequence.length - 1].col;
  const totalDuration = leadIn + lastCol * spc + 1.2;
  previewEndTimer = setTimeout(() => {
    previewPlaying = false;
    setPreviewButtonState(false);
    previewNodes = [];
  }, totalDuration * 1000);
}

function stopPreview() {
  previewPlaying = false;
  setPreviewButtonState(false);
  if (previewEndTimer) { clearTimeout(previewEndTimer); previewEndTimer = null; }
  previewNodes.forEach(node => { try { node.stop(); } catch (e) { /* already stopped */ } });
  previewNodes = [];
}

function renderWaterfallLabels() {
  const labels = document.getElementById('wfLabels');
  labels.innerHTML = '';
  currentTab.parsed.stringKeys.forEach(key => {
    const d = document.createElement('div');
    d.textContent = key;
    labels.appendChild(d);
  });
}

function buildWaterfall() {
  const layer = document.getElementById('wfNotesLayer');
  layer.innerHTML = '';
  const stringKeys = currentTab.parsed.stringKeys;
  const rows = stringKeys.map(() => document.createElement('div'));
  rows.forEach((row, i) => {
    row.className = 'wf-lane-row';
    row.style.top = (i * LANE_HEIGHT) + 'px';
  });

  let maxTime = 1;
  currentTab.parsed.sequence.forEach((group, idx) => {
    const t = scheduleTimes[idx];
    maxTime = Math.max(maxTime, t);
    group.notes.forEach(n => {
      const rIdx = stringKeys.indexOf(n.stringKey);
      if (rIdx === -1) return;
      const chip = document.createElement('div');
      chip.className = 'wf-chip pending';
      chip.textContent = n.fret;
      chip.dataset.idx = idx;
      chip.style.left = (LANE_OFFSET + t * PX_PER_SEC) + 'px';
      rows[rIdx].appendChild(chip);
    });
  });

  const totalWidth = LANE_OFFSET + (maxTime * PX_PER_SEC) + 200;
  rows.forEach(row => { row.style.width = totalWidth + 'px'; layer.appendChild(row); });
  layer.style.width = totalWidth + 'px';
  layer.style.transform = 'translateX(0px)';
}

function updateWaterfallScroll(elapsed) {
  const layer = document.getElementById('wfNotesLayer');
  if (layer) layer.style.transform = `translateX(${-(elapsed * PX_PER_SEC)}px)`;
}

function updateCountInOverlay(elapsed) {
  const overlay = document.getElementById('countInOverlay');
  if (elapsed < countInSeconds) {
    overlay.style.display = 'flex';
    const beatsLeft = Math.max(1, COUNT_IN_BEATS - Math.floor(elapsed / secPerBeat));
    overlay.textContent = `Get ready… ${beatsLeft}`;
  } else {
    overlay.style.display = 'none';
  }
}

function updateActiveChip(elapsed) {
  document.querySelectorAll('.wf-chip.active').forEach(c => c.classList.remove('active'));
  if (!currentTab || seqIndex >= currentTab.parsed.sequence.length) return;
  const t = scheduleTimes[seqIndex];
  const inWindow = waitMode
    ? elapsed >= t - hitWindow
    : (elapsed >= t - hitWindow && elapsed <= t + hitWindow);
  if (inWindow) {
    document.querySelectorAll(`.wf-chip[data-idx="${seqIndex}"]`).forEach(c => c.classList.add('active'));
  }
}

function updateWaterfallResult(idx, status) {
  document.querySelectorAll(`.wf-chip[data-idx="${idx}"]`).forEach(c => {
    c.classList.remove('active', 'pending');
    c.classList.add(status);
  });
}

function judgeTiming(elapsed) {
  if (!currentTab || seqIndex >= currentTab.parsed.sequence.length) return;
  const t = scheduleTimes[seqIndex];
  if (results[seqIndex] === null && elapsed > t + hitWindow) {
    if (waitMode) {
      if (!isPaused) {
        isPaused = true;
        pauseStartTime = audioCtx.currentTime;
      }
      // Frozen here until the correct note is played — see markResult(),
      // which resumes the clock the moment a hit is registered.
    } else {
      markResult('miss'); // time's up for this note — keep the tempo flowing
    }
  }
}

function loadTab(tabObj) {
  try {
    const parsed = parseTab(tabObj.tab);
    currentTab = { ...tabObj, parsed };
    seqIndex = 0;
    results = new Array(parsed.sequence.length).fill(null);
    renderTab();
    renderWaterfallLabels();
    document.getElementById('practiceEmpty').style.display = 'none';
    document.getElementById('practiceMain').style.display = 'flex';
    document.getElementById('practiceTitle').textContent = tabObj.title || 'Custom tab';
    document.getElementById('practiceSub').textContent = 'Tap Start, then play along';
    updateTarget();
    switchView('practice');
  } catch (e) {
    document.getElementById('importError').textContent = e.message;
  }
}

function renderTab() {
  const container = document.getElementById('tabRender');
  container.innerHTML = '';
  const stringKeys = currentTab.parsed.stringKeys;

  // Build a per-string array of cells aligned to sequence index
  const rows = stringKeys.map(key => ({ key, cells: [] }));

  currentTab.parsed.sequence.forEach((group, idx) => {
    const notesOnRow = {};
    group.notes.forEach(n => { notesOnRow[n.stringKey] = n.fret; });
    stringKeys.forEach((key, rIdx) => {
      if (notesOnRow[key] !== undefined) {
        rows[rIdx].cells.push({ idx, fret: notesOnRow[key] });
      } else {
        rows[rIdx].cells.push({ idx: null, fret: null });
      }
    });
  });

  rows.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'tabrow tab-mono';
    const label = document.createElement('span');
    label.className = 'stringname';
    label.textContent = row.key;
    rowEl.appendChild(label);
    row.cells.forEach(cell => {
      const cellEl = document.createElement('span');
      cellEl.className = 'fretcell';
      if (cell.fret !== null) {
        cellEl.textContent = cell.fret;
        cellEl.classList.add('note', 'pending');
        cellEl.dataset.idx = cell.idx;
      } else {
        cellEl.textContent = '-';
      }
      rowEl.appendChild(cellEl);
    });
    container.appendChild(rowEl);
  });
  highlightCurrent();
}

function highlightCurrent() {
  const cells = document.querySelectorAll('.fretcell.note');
  cells.forEach(c => {
    const idx = parseInt(c.dataset.idx, 10);
    c.classList.remove('current', 'hit', 'miss', 'pending');
    if (results[idx] === 'hit') c.classList.add('hit');
    else if (results[idx] === 'miss') c.classList.add('miss');
    else if (idx === seqIndex) c.classList.add('current');
    else c.classList.add('pending');
  });
  // scroll current into view
  const cur = document.querySelector('.fretcell.current');
  if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
}

function updateTarget() {
  const targetEl = document.getElementById('targetNote');
  if (!currentTab || seqIndex >= currentTab.parsed.sequence.length) {
    targetEl.textContent = practiceRunning ? 'Done!' : '—';
    return;
  }
  const group = currentTab.parsed.sequence[seqIndex];
  const names = group.notes.map(n => `${n.stringKey} str, fret ${n.fret} (${midiToName(n.midi)})`);
  targetEl.textContent = names.join(' + ');
}

function onPitchDetected(midi) {
  const heardEl = document.getElementById('heardNote');
  const needle = document.getElementById('needle');

  if (midi === null) {
    heardEl.innerHTML = 'Listening…';
    needle.style.left = '50%';
    needle.style.background = 'var(--ink-dim)';
    holdFrames = 0;
    return;
  }

  const roundedMidi = Math.round(midi);
  heardEl.innerHTML = `Hearing <b>${midiToName(roundedMidi)}</b>`;

  if (!practiceRunning || !currentTab || seqIndex >= currentTab.parsed.sequence.length) {
    needle.style.left = '50%';
    needle.style.background = 'var(--ink-dim)';
    return;
  }

  const group = currentTab.parsed.sequence[seqIndex];
  // pick the closest expected note in this chord/group to the detected pitch
  let best = null, bestDiff = Infinity;
  for (const n of group.notes) {
    const diffCents = (midi - n.midi) * 100;
    if (Math.abs(diffCents) < Math.abs(bestDiff)) { bestDiff = diffCents; best = n; }
  }

  const pct = Math.max(-50, Math.min(50, bestDiff / 2)); // scale cents to +/-50%
  needle.style.left = `calc(50% + ${pct}%)`;

  if (Math.abs(bestDiff) <= CENTS_TOLERANCE) {
    needle.style.background = 'var(--hit)';
    holdFrames++;
    const t = scheduleTimes[seqIndex];
    const elapsed = audioCtx ? audioCtx.currentTime - practiceStartTime - totalPausedDuration : 0;
    const withinWindow = t === undefined ? false
      : waitMode ? elapsed >= t - hitWindow
      : (elapsed >= t - hitWindow && elapsed <= t + hitWindow);
    if (holdFrames >= HOLD_NEEDED && withinWindow) {
      markResult('hit');
    }
  } else {
    needle.style.background = bestDiff > 0 ? 'var(--brass)' : 'var(--miss)';
    holdFrames = 0;
  }
}

function markResult(status) {
  if (isPaused) {
    const pauseDuration = audioCtx.currentTime - pauseStartTime;
    totalPausedDuration += pauseDuration;
    nextClickTime += pauseDuration; // keep the metronome grid aligned after resuming
    isPaused = false;
  }
  results[seqIndex] = status;
  updateWaterfallResult(seqIndex, status);
  seqIndex++;
  holdFrames = 0;
  highlightCurrent();
  updateTarget();
  updateScore();
  if (seqIndex >= currentTab.parsed.sequence.length) {
    finishPractice();
  }
}

function updateScore() {
  const done = results.filter(r => r !== null).length;
  const hits = results.filter(r => r === 'hit').length;
  if (done === 0) return;
  const pct = Math.round((hits / done) * 100);
  const pill = document.getElementById('globalScore');
  pill.style.display = 'inline-block';
  document.getElementById('globalScoreVal').textContent = `${pct}% (${hits}/${done})`;
}

function finishPractice() {
  practiceRunning = false;
  document.getElementById('startBtn').textContent = 'Start Practice';
  document.getElementById('practiceSub').textContent = 'Run complete — check your accuracy above';
  stopTempoEngine();
  stopMic();
}

document.getElementById('startBtn').addEventListener('click', async () => {
  if (!currentTab) return;
  if (practiceRunning) {
    practiceRunning = false;
    document.getElementById('startBtn').textContent = 'Start Practice';
    stopTempoEngine();
    stopMic();
    return;
  }
  if (previewPlaying) stopPreview();
  const ok = await startMic();
  if (!ok) return;
  practiceRunning = true;
  document.getElementById('startBtn').textContent = 'Stop';
  document.getElementById('practiceSub').textContent = `Count-in, then play at ${bpm} BPM`;
  startTempoEngine();
  updateTarget();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!currentTab) return;
  if (previewPlaying) stopPreview();
  seqIndex = 0;
  results = new Array(currentTab.parsed.sequence.length).fill(null);
  practiceRunning = false;
  isPaused = false;
  totalPausedDuration = 0;
  stopTempoEngine();
  stopMic();
  document.getElementById('startBtn').textContent = 'Start Practice';
  document.getElementById('practiceSub').textContent = 'Tap Start, then play along';
  document.getElementById('globalScore').style.display = 'none';
  highlightCurrent();
  updateTarget();
});

document.getElementById('bpmInput').addEventListener('change', (e) => {
  let v = parseInt(e.target.value, 10);
  if (isNaN(v)) v = 80;
  v = Math.max(30, Math.min(220, v));
  bpm = v;
  e.target.value = v;
});
document.getElementById('bpmUp').addEventListener('click', () => {
  const input = document.getElementById('bpmInput');
  bpm = Math.min(220, bpm + 5);
  input.value = bpm;
});
document.getElementById('bpmDown').addEventListener('click', () => {
  const input = document.getElementById('bpmInput');
  bpm = Math.max(30, bpm - 5);
  input.value = bpm;
});
document.getElementById('gridSelect').addEventListener('change', (e) => {
  subdivision = parseInt(e.target.value, 10);
});
document.getElementById('metroToggle').addEventListener('click', (e) => {
  metronomeOn = !metronomeOn;
  e.target.classList.toggle('on', metronomeOn);
  e.target.textContent = metronomeOn ? '🔊' : '🔇';
});
document.getElementById('waitToggle').addEventListener('click', (e) => {
  waitMode = !waitMode;
  e.target.classList.toggle('on', waitMode);
  e.target.title = waitMode
    ? 'Waiting for the correct note (tap to switch back to strict tempo)'
    : 'Wait for the correct note instead of moving on';
});
document.getElementById('previewBtn').addEventListener('click', playPreview);

/* ============================================================
   5. LIBRARY UI + IMPORT
   ============================================================ */

function renderLibrary() {
  const list = document.getElementById('songList');
  list.innerHTML = '';
  LIBRARY.forEach(song => {
    const card = document.createElement('div');
    card.className = 'song-card';
    card.innerHTML = `<div><div>${song.title}</div><div class="meta">${song.meta}</div></div><div class="go">▸</div>`;
    card.addEventListener('click', () => loadTab(song));
    list.appendChild(card);
  });
}

document.getElementById('importBtn').addEventListener('click', () => {
  const title = document.getElementById('importTitle').value.trim() || 'My tab';
  const text = document.getElementById('importText').value;
  document.getElementById('importError').textContent = '';
  if (!text.trim()) {
    document.getElementById('importError').textContent = 'Paste a tab first.';
    return;
  }
  loadTab({ id: 'custom', title, meta: 'Imported', tab: text });
});

/* ============================================================
   6. VIEW SWITCHING

function switchView(name) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  document.getElementById('view-library').classList.toggle('active', name === 'library');
  document.getElementById('view-practice').classList.toggle('active', name === 'practice');
}
document.querySelectorAll('nav.tabs button').forEach(b => {
  b.addEventListener('click', () => switchView(b.dataset.view));
});

renderLibrary();
</script>
